[package]
name = "attest-time"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
attest-data.path = "../attest-data"
clap.workspace = true
clap-verbosity.workspace = true
ctrlc.workspace = true
env_logger.workspace = true
log.workspace = true
platform-rot = { path = "../platform-rot", default-features = false }
tokio = { workspace = true, features = ["full"] }
slog.workspace = true
slog-async.workspace = true
slog-envlogger.workspace = true
slog-stdlog.workspace = true
slog-term.workspace = true

[features]
default = ["hiffy"]
ipcc = ["platform-rot/ipcc"]
hiffy = []
