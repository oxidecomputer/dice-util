name: test suite
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    name: cargo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      # The Microsoft Ubuntu mirror is unstable: https://github.com/actions/runner-images/issues/7048
      - name: Disable Microsoft Ubuntu mirror
        run: sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
      - run: sudo apt-get update
      - run: sudo apt-get install -y pkg-config libudev-dev
      - run: cargo build --workspace
      - run: cargo build --package attest-data --package dice-mfg-msgs
      - run: cargo build --package verifier-cli # default features
      - run: cargo build --package verifier-cli --no-default-features
      - run: cargo build --package verifier-cli --no-default-features --features hiffy
      - run: cargo build --package verifier-cli --no-default-features --features ipcc
      - run: cargo build --package verifier-cli --no-default-features --features sled-agent
      - run: cargo build --package verifier-cli --all-features
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      # The Microsoft Ubuntu mirror is unstable: https://github.com/actions/runner-images/issues/7048
      - name: Disable Microsoft Ubuntu mirror
        run: sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
      - run: sudo apt-get update
      - run: sudo apt-get install -y pkg-config libudev-dev
      - run: cargo test --package attest-data
      - run: cargo test --package dice-mfg-msgs
      - run: cargo test --all-features --locked
  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      # The Microsoft Ubuntu mirror is unstable: https://github.com/actions/runner-images/issues/7048
      - name: Disable Microsoft Ubuntu mirror
        run: sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
      - run: sudo apt-get update
      - run: sudo apt-get install -y pkg-config libudev-dev
      - run: cargo doc --all-features --locked --no-deps
