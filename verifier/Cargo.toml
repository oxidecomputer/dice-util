[package]
name = "dice-verifier"
version = "0.3.0-pre0"
edition = "2021"
description = "a library crate implementing the attestation verifier"
license = "MPL-2.0"

[dependencies]
attest-data = { path = "../attest-data", features = ["std"] }
async-trait.workspace = true
const-oid.workspace = true
ed25519-dalek = { workspace = true, features = ["std"] }
hex = { workspace = true }
hubpack.workspace = true
p384 = { workspace = true, default-features = true }
rats-corim.workspace = true
sha3.workspace = true
thiserror.workspace = true
x509-cert = { workspace = true, default-features = true }

[build-dependencies]
anyhow.workspace = true
camino = { workspace = true, optional = true }
cfg-if.workspace = true
pki-playground = { workspace = true, optional = true }

[dev-dependencies]
attest-data = { path = "../attest-data", features = ["std", "testing"] }
dice-verifier = { path = "../verifier", features = ["unittest"] }

[features]
unittest = ["camino", "pki-playground"]
